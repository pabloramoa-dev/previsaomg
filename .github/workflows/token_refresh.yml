name: Token — conferir validade (Meta)

# O @previsaomg publica por graph.facebook.com com token de USUÁRIO DO SISTEMA
# do BM01 (login unificado). Esse token não expira e não
# tem endpoint de "refresh": o antigo graph.instagram.com/refresh_access_token
# só vale para token do login do Instagram e falharia com ele. Por isso este
# workflow NÃO renova nem grava secret (não precisa de GH_PAT_SECRETS): só
# confere, sem revelar a credencial, que o token continua válido e permanente.
# Se um dia a Meta invalidar o token (troca de senha, permissão removida,
# usuário do sistema apagado), a falha aqui avisa antes do Reel falhar; a
# correção é gerar um novo token do usuário do sistema no BM01 e colar em
# Settings > Secrets > IG_ACCESS_TOKEN.

on:
  schedule:
    - cron: '0 9 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: Tipo e validade do token (sem revelar)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
        run: python -m scripts.token_info --exigir-sem-expiracao
